[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-data"
version = "0.1.0"
description = "Bossard Golden Dataset toolkit for taxonomy, normalization, and AI-assisted catalog analysis."
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Bossard / Chris", email = "you@example.com" }
]

license = { text = "Proprietary" }

# Core runtime dependencies
dependencies = [
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "duckdb>=0.9",
  "rich>=13.0",
]

# Optional extras (install with: pip install .[dev], pip install .[notebook])
[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "ruff>=0.4",
]
notebook = [
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://example.com"
Repository = "https://example.com/repo"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------
# Tooling configuration
# -----------------------------

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]  # basic errors & warnings
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"